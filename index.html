<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="스마트안전AI">
  <title>통합 산업안전 AI 대시보드</title>

  <!-- Markdown 파서 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151d30;
      --bg-input: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      background-color: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    header {
      background-color: rgba(21, 29, 48, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* 모드 전환 탭 */
    .mode-tabs {
      display: flex;
      background: var(--bg-input);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0b0f19;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* 아이패드 2단 분할 레이아웃 */
    .dashboard-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px - var(--safe-top) - var(--safe-bottom));
      overflow: hidden;
    }

    .panel-input {
      width: 440px;
      border-right: 1px solid var(--border);
      background-color: rgba(15, 23, 42, 0.7);
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-output {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      background-color: var(--bg-main);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-mic {
      background: none;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-mic.recording {
      color: var(--danger);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    input, select, textarea {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
    }

    /* 이미지 업로드 영역 */
    .image-dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      background-color: rgba(30, 41, 59, 0.4);
      cursor: pointer;
      position: relative;
    }

    .preview-box {
      position: relative;
      margin-top: 8px;
      display: none;
    }

    .preview-box img {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .btn-remove-img {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-submit {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 결과창 및 후속 질의 */
    .report-card {
      flex: 1;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      overflow-y: auto;
      line-height: 1.7;
    }

    .chat-section {
      display: flex;
      gap: 8px;
      background: var(--bg-card);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .chat-section input {
      flex: 1;
    }

    /* 마크다운 결과 서식 */
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: var(--accent);
      margin-top: 18px;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    .markdown-body th {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
    }
    .markdown-body strong {
      color: #7dd3fc;
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-content {
      background: var(--bg-card);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      border: 1px solid var(--border);
    }

    /* 인쇄 전용 스타일 */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
        overflow: visible !important;
        height: auto !important;
      }
      header, .panel-input, .chat-section, .header-actions {
        display: none !important;
      }
      .dashboard-body, .panel-output, .report-card {
        display: block !important;
        height: auto !important;
        padding: 0 !important;
        border: none !important;
        background: #fff !important;
        color: #000 !important;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body strong {
        color: #000 !important;
      }
      .markdown-body th {
        background: #f0f0f0 !important;
        color: #000 !important;
      }
      .markdown-body th, .markdown-body td {
        border-color: #999 !important;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 내비게이션 바 -->
  <header>
    <div class="brand">
      <span>🛡️ AI 방재·안전 종합센터</span>
    </div>

    <!-- 3대 모드 선택 -->
    <div class="mode-tabs">
      <button class="tab-btn active" onclick="switchMode('accident')">🚨 사고 분석 & 재발방지</button>
      <button class="tab-btn" onclick="switchMode('hazard')">⚠️ 잠재 위험점 발굴</button>
      <button class="tab-btn" onclick="switchMode('inspect')">🔍 현장·설비 정밀 묘사</button>
    </div>

    <div class="header-actions">
      <button class="btn-action" onclick="window.print()">🖨️ PDF/인쇄</button>
      <button class="btn-action" onclick="openSettings()">⚙️ API 키</button>
    </div>
  </header>

  <!-- 대시보드 본체 -->
  <div class="dashboard-body">
    <!-- 좌측 입력 패널 -->
    <div class="panel-input">
      
      <!-- 사진 첨부 공통 영역 -->
      <div class="form-group">
        <label>현장 사진 첨부 (카메라 촬영 또는 보관함 선택)</label>
        <div class="image-dropzone" onclick="document.getElementById('fileInput').click()">
          <span id="uploadHint" style="font-size: 0.85rem; color: var(--text-muted);">
            📷 탭하여 사진 촬영 또는 앨범 사진 선택
          </span>
          <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImage(this)">
          <div class="preview-box" id="previewContainer">
            <img id="imagePreview" src="">
            <button class="btn-remove-img" type="button" onclick="removeImage(event)">✕</button>
          </div>
        </div>
      </div>

      <!-- 동적 입력 폼 -->
      <div id="dynamicForm"></div>

      <button class="btn-submit" id="btnSubmit" onclick="runAnalysis()">실행</button>
    </div>

    <!-- 우측 분석 리포트 및 후속 질의 패널 -->
    <div class="panel-output">
      <div class="report-card" id="reportArea">
        <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted); text-align:center;">
          <div style="font-size:3rem; margin-bottom:12px;">📊</div>
          <div>상단 모드를 선택하고 사진 또는 현장 데이터를 입력한 후 실행하세요.<br>전문적인 안전 분석 및 현장 정밀 진단이 수행됩니다.</div>
        </div>
      </div>

      <!-- 추가 심층 질의 -->
      <div class="chat-section">
        <input type="text" id="chatInput" placeholder="분석 결과에 대해 추가로 질문하세요 (예: 제안된 인터록 기준 구체화)" onkeydown="if(event.key==='Enter') sendFollowUp()">
        <button class="btn-action" style="background:var(--accent); color:#0b0f19; font-weight:bold;" onclick="sendFollowUp()">질문 전송</button>
      </div>
    </div>
  </div>

  <!-- API 설정 모달 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <h3 style="margin-bottom:12px;">Google Gemini API 키 등록</h3>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">
        Google AI Studio에서 발급받은 API 키를 입력하세요. 아이패드 내부(localStorage)에 안전하게 저장됩니다.
      </p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." style="margin-bottom:16px;">
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn-action" onclick="closeSettings()">닫기</button>
        <button class="btn-action" style="background:var(--accent); color:#0b0f19; font-weight:bold;" onclick="saveSettings()">저장</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'GEMINI_SAFETY_HUB_KEY';
    let currentMode = 'accident';
    let currentImageBase64 = null;
    let currentImageMime = null;
    let conversationHistory = [];

    // 모드별 폼 템플릿
    const formTemplates = {
      accident: `
        <div class="form-group">
          <label>사고 유형 분류</label>
          <select id="accType">
            <option value="화재 및 폭발">화재 및 폭발</option>
            <option value="유해화학물질 누출/접촉">유해화학물질 누출/접촉</option>
            <option value="감전 및 전기재해">감전 및 전기설비 사고</option>
            <option value="질식 및 유해가스 중독">질식 및 가스 중독</option>
            <option value="기계 끼임 및 협착">기계 끼임 및 협착</option>
            <option value="추락 및 낙하">고소작업 추락 및 낙하</option>
            <option value="기타">기타 안전사고</option>
          </select>
        </div>
        <div class="form-group">
          <label>발생 장소 / 공정 / 설비명</label>
          <input type="text" id="accLocation" placeholder="예: 유기용제 공급 룸 유량계 플랜지">
        </div>
        <div class="form-group">
          <div class="label-row">
            <label>사고 경위 및 발생 상황</label>
            <button class="btn-mic" type="button" onclick="toggleVoice('accSituation', this)">🎤 음성입력</button>
          </div>
          <textarea id="accSituation" placeholder="사고 발생 전후 상황, 작업자 행동, 설비 이상 유무 등을 구체적으로 기술"></textarea>
        </div>
        <div class="form-group">
          <label>초기 1차 조치 내역</label>
          <textarea id="accInitialAction" style="min-height:60px;" placeholder="예: 비상 밸브 차단, 국소배기 강제 가동, 작업자 대피 등"></textarea>
        </div>
      `,
      hazard: `
        <div class="form-group">
          <label>점검 대상 구역 / 설비</label>
          <input type="text" id="hazLocation" placeholder="예: 옥외 위험물 저장탱크 로딩암 또는 배전반">
        </div>
        <div class="form-group">
          <label>진행 중인 작업 / 운영 환경</label>
          <input type="text" id="hazWorkType" placeholder="예: 정기 유지보수 점검, 화학물질 이송 하역 작업 등">
        </div>
        <div class="form-group">
          <div class="label-row">
            <label>식별된 불안전 상태 / 행동 메모</label>
            <button class="btn-mic" type="button" onclick="toggleVoice('hazNotes', this)">🎤 음성입력</button>
          </div>
          <textarea id="hazNotes" placeholder="현장에서 관찰된 잠재 위험 요소, 미비된 방호장치, 부적절한 배선/배관 상태 등"></textarea>
        </div>
      `,
      inspect: `
        <div class="form-group">
          <div class="label-row">
            <label>추가 확인 요구사항 (선택사항)</label>
            <button class="btn-mic" type="button" onclick="toggleVoice('inspectNotes', this)">🎤 음성입력</button>
          </div>
          <textarea id="inspectNotes" placeholder="사진 속에서 특히 자세히 확인하고 싶은 설비 부위나 궁금한 점을 적어주세요. (미기재 시 사진 전체를 정밀 서술합니다)"></textarea>
        </div>
      `
    };

    window.onload = () => {
      renderForm();
      if (!localStorage.getItem(STORAGE_KEY)) openSettings();
    };

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', 
          (mode === 'accident' && idx === 0) || 
          (mode === 'hazard' && idx === 1) || 
          (mode === 'inspect' && idx === 2)
        );
      });
      renderForm();
      const submitBtn = document.getElementById('btnSubmit');
      if (mode === 'accident') submitBtn.innerText = '🚨 사고 원인분석 & 대책 수립';
      else if (mode === 'hazard') submitBtn.innerText = '⚠️ 잠재 위험점 진단 & 개선안 도출';
      else submitBtn.innerText = '🔍 현장·설비 정밀 묘사 실행';
    }

    function renderForm() {
      document.getElementById('dynamicForm').innerHTML = formTemplates[currentMode];
    }

    /* 이미지 처리 */
    function handleImage(input) {
      const file = input.files[0];
      if (!file) return;

      currentImageMime = file.type;
      const reader = new FileReader();
      reader.onload = (e) => {
        const fullBase64 = e.target.result;
        currentImageBase64 = fullBase64.split(',')[1];
        document.getElementById('imagePreview').src = fullBase64;
        document.getElementById('previewContainer').style.display = 'block';
        document.getElementById('uploadHint').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function removeImage(e) {
      e.stopPropagation();
      currentImageBase64 = null;
      currentImageMime = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('previewContainer').style.display = 'none';
      document.getElementById('uploadHint').style.display = 'inline';
    }

    /* 음성 인식 (STT) */
    let recognition = null;
    function toggleVoice(targetId, btn) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('이 기기/브라우저는 음성 인식을 지원하지 않습니다.');
        return;
      }

      if (recognition) {
        recognition.stop();
        recognition = null;
        btn.classList.remove('recording');
        btn.innerText = '🎤 음성입력';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.continuous = false;
      recognition.interimResults = false;

      btn.classList.add('recording');
      btn.innerText = '🔴 듣는 중...';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const target = document.getElementById(targetId);
        target.value = target.value ? target.value + ' ' + transcript : transcript;
      };

      recognition.onerror = () => {
        btn.classList.remove('recording');
        btn.innerText = '🎤 음성입력';
        recognition = null;
      };

      recognition.onend = () => {
        btn.classList.remove('recording');
        btn.innerText = '🎤 음성입력';
        recognition = null;
      };

      recognition.start();
    }

    /* 분석 요청 (Gemini 3.8 Flash 적용) */
    async function runAnalysis() {
      const apiKey = localStorage.getItem(STORAGE_KEY);
      if (!apiKey) {
        alert('API 키를 먼저 등록해주세요.');
        openSettings();
        return;
      }

      let systemPrompt = '';
      let userContext = '';

      if (currentMode === 'accident') {
        const accType = document.getElementById('accType').value;
        const location = document.getElementById('accLocation').value.trim();
        const situation = document.getElementById('accSituation').value.trim();
        const initial = document.getElementById('accInitialAction').value.trim();

        if (!situation && !currentImageBase64) {
          alert('사고 경위를 작성하거나 현장 사진을 첨부해주세요.');
          return;
        }

        systemPrompt = `
당신은 국가 공인 산업안전보건 및 방재 소방 최고 기술사입니다.
첨부된 사진(있는 경우)과 사고 정보를 정밀 분석하여 법적·기술적으로 타당한 재발방지대책 보고서를 작성하세요.

[필수 보고서 양식]
### 1. 사고 개요 및 핵심 위험성 요약
### 2. 근본 원인 분석 (4M 기법)
- **인적 요인 (Man)**
- **기계·설비적 요인 (Machine)** (사진상 파손, 부식, 인터록 상태 등 반영)
- **환경·물질적 요인 (Media)**
- **관리적 요인 (Management)**
### 3. 위험성평가 매트릭스 (개선 전/후 비교 표)
| 구분 | 빈도 | 강도 | 위험도 등급 | 판정 |
|---|---|---|---|---|
| 개선 전 (현 상태) | ... | ... | ... | ... |
| 개선 후 (대책 적용) | ... | ... | ... | ... |
### 4. 법적·기술 규정 준수 검토
(산업안전보건기준에 관한 규칙, 화재안전기술기준 NFTC, KOSHA Guide 등 연관 조항 구체적 적시)
### 5. 3단계 재발방지대책
- **공학적 대책 (Engineering)**
- **관리적 대책 (Administrative)**
- **보호구 및 비상대응 절차 (PPE & Response)**
`;
        userContext = `[사고 유형] ${accType}\n[장소/설비] ${location || '미기재'}\n[사고 상황] ${situation || '사진 참조'}\n[1차 조치] ${initial || '미기재'}`;

      } else if (currentMode === 'hazard') {
        const location = document.getElementById('hazLocation').value.trim();
        const workType = document.getElementById('hazWorkType').value.trim();
        const notes = document.getElementById('hazNotes').value.trim();

        if (!notes && !currentImageBase64) {
          alert('점검 메모를 입력하거나 현장 사진을 첨부해주세요.');
          return;
        }

        systemPrompt = `
당신은 산업현장 안전 진단 및 위험성평가 전문 기술사입니다.
제공된 사진 및 현장 정보를 분석하여 아직 사고가 나지 않았지만 잠재된 모든 위험점을 선제적으로 도출하고 개선안을 수립하세요.

[필수 보고서 양식]
### 1. 현장 안전 점검 총평 및 잠재 위험도 수준
### 2. 식별된 불안전 요소 (Unsafe Acts & Conditions)
- **불안전한 상태 (설비/환경 결함, 방호장치 누락 등)**
- **불안전한 행동 (작업자 수칙 위반 가능성 등)**
### 3. 예상 사고 시나리오 및 최악의 결과
### 4. 위험성 등급 평가 (빈도 x 강도)
### 5. 선제적 개선 권고사항
- **즉시 조치 사항 (Quick-Win)**
- **근본적 설비·시스템 개선안 (중장기)**
- **점검 체크리스트 가이드 (작업 전 확인 사항)**
`;
        userContext = `[점검 대상] ${location || '현장 사진 기준'}\n[작업/환경] ${workType || '일반 운영'}\n[특이사항 메모] ${notes || '사진 정밀 진단 요청'}`;

      } else if (currentMode === 'inspect') {
        if (!currentImageBase64) {
          alert('현장·설비 정밀 묘사 모드는 사진 첨부가 필수입니다.');
          return;
        }
        const notes = document.getElementById('inspectNotes').value.trim();

        systemPrompt = `
당신은 현장 감식 및 고도 시각 정보 해설 전문가입니다.
시각장애인이 머릿속에 완벽하게 장면을 그릴 수 있을 만큼, 사진의 모든 디테일을 객관적이고 구체적으로 해설하세요.

[필수 해설 양식]
### 1. 공간 전체 구도 및 분위기 개관
(시야의 좌/우, 상/하, 전경과 배경의 배치, 조명 상태, 공간 유형)
### 2. 주요 설비 및 사물 정밀 식별
- 기기/장비의 명칭, 추정 모델명, 재질, 색상
- 배관, 밸브, 케이블, 스위치, 배전반 등의 정확한 위치 및 상태 (개폐 여부, 연결 상태 등)
- 사진 내 식별 가능한 모든 문자, 라벨, 명판, 안전 표지판의 텍스트와 의미
### 3. 미세 상태 및 결함 관찰
(부식, 마모, 균열, 오염, 누액 흔적, 피복 손상, 먼지 적체, 볼트 체결 여부 등 극도로 미세한 디테일)
### 4. 작업 환경 및 주변 위험 징후 객관적 서술
`;
        userContext = notes ? `[추가 요구사항] ${notes}` : `사진에 찍힌 모든 시각적 정보를 시각장애인 낭독 수준으로 상세히 해설해 주세요.`;
      }

      const submitBtn = document.getElementById('btnSubmit');
      const reportArea = document.getElementById('reportArea');

      submitBtn.disabled = true;
      submitBtn.innerText = '⏳ AI 분석 및 보고서 작성 중...';
      reportArea.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">지능형 비전 및 방재 안전 모델이 분석을 수행하고 있습니다...</div>';

      try {
        const parts = [{ text: systemPrompt + "\n\n" + userContext }];

        if (currentImageBase64) {
          parts.unshift({
            inline_data: {
              mime_type: currentImageMime || 'image/jpeg',
              data: currentImageBase64
            }
          });
        }

        const payload = {
          contents: [{ role: 'user', parts: parts }],
          generationConfig: { temperature: 0.2 }
        };

        // 최신 gemini-3.8-flash 엔드포인트 호출
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          reportArea.innerHTML = `<div class="markdown-body">${marked.parse(reply)}</div>`;
          conversationHistory = [
            { role: 'user', parts: parts },
            { role: 'model', parts: [{ text: reply }] }
          ];
        } else {
          reportArea.innerHTML = '<p style="color:var(--danger)">분석 결과를 생성하지 못했습니다.</p>';
        }

      } catch (err) {
        alert('분석 오류: ' + err.message);
        reportArea.innerHTML = `<p style="color:var(--danger)">오류 발생: ${err.message}</p>`;
      } finally {
        submitBtn.disabled = false;
        switchMode(currentMode);
      }
    }

    /* 후속 연속 질의 (Gemini 3.8 Flash 적용) */
    async function sendFollowUp() {
      const apiKey = localStorage.getItem(STORAGE_KEY);
      const input = document.getElementById('chatInput');
      const question = input.value.trim();
      if (!question) return;
      if (!conversationHistory.length) {
        alert('먼저 1차 분석을 실행한 후 추가 질문을 진행해주세요.');
        return;
      }

      input.value = '';
      const reportArea = document.getElementById('reportArea');
      reportArea.innerHTML += `
        <div style="margin-top:20px; padding:12px; background:rgba(56,189,248,0.1); border-left:4px solid var(--accent); border-radius:4px;">
          <strong>질문:</strong> ${question}
        </div>
        <div id="followupLoading" style="color:var(--text-muted); margin-top:8px;">답변 생성 중...</div>
      `;
      reportArea.scrollTop = reportArea.scrollHeight;

      conversationHistory.push({
        role: 'user',
        parts: [{ text: question }]
      });

      try {
        // 최신 gemini-3.8-flash 엔드포인트 호출
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: conversationHistory,
            generationConfig: { temperature: 0.3 }
          })
        });

        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        document.getElementById('followupLoading')?.remove();

        if (reply) {
          reportArea.innerHTML += `<div class="markdown-body" style="margin-top:12px;">${marked.parse(reply)}</div>`;
          conversationHistory.push({
            role: 'model',
            parts: [{ text: reply }]
          });
          reportArea.scrollTop = reportArea.scrollHeight;
        }
      } catch (err) {
        document.getElementById('followupLoading')?.remove();
        alert('후속 질의 오류: ' + err.message);
      }
    }

    /* 설정 모달 */
    function openSettings() {
      document.getElementById('apiKeyInput').value = localStorage.getItem(STORAGE_KEY) || '';
      document.getElementById('settingsModal').style.display = 'flex';
    }
    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }
    function saveSettings() {
      const k = document.getElementById('apiKeyInput').value.trim();
      if (!k) return alert('키를 입력하세요');
      localStorage.setItem(STORAGE_KEY, k);
      closeSettings();
    }
  </script>
