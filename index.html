<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="스마트안전AI">
  <title>통합 산업안전 AI 대시보드</title>

  <!-- Markdown 파서 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151d30;
      --bg-input: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      background-color: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    header {
      background-color: rgba(21, 29, 48, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .mode-tabs {
      display: flex;
      background: var(--bg-input);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0b0f19;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-action {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn-action.highlight {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: bold;
    }

    /* 본체 레이아웃 */
    .dashboard-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 58px - var(--safe-top) - var(--safe-bottom));
      overflow: hidden;
      position: relative;
    }

    /* 좌측 입력 패널 (접힘 지원) */
    .panel-input {
      width: 440px;
      border-right: 1px solid var(--border);
      background-color: rgba(15, 23, 42, 0.85);
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: width 0.25s ease, padding 0.25s ease, opacity 0.2s ease;
      flex-shrink: 0;
    }

    /* 전체화면 모드일 때 좌측 패널 숨김 */
    .dashboard-body.fullscreen-mode .panel-input {
      width: 0 !important;
      padding: 0 !important;
      border-right: none !important;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* 우측 결과 출력 패널 */
    .panel-output {
      flex: 1;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      background-color: var(--bg-main);
      width: 100%;
    }

    .report-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .report-title-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-mic {
      background: none;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-mic.recording {
      color: var(--danger);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    input, select, textarea {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 85px;
      line-height: 1.5;
    }

    .image-dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      background-color: rgba(30, 41, 59, 0.4);
      cursor: pointer;
      position: relative;
    }

    .preview-box {
      position: relative;
      margin-top: 6px;
      display: none;
    }

    .preview-box img {
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .btn-remove-img {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-submit {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 결과 카드 (가독성 극대화) */
    .report-card {
      flex: 1;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px 28px;
      overflow-y: auto;
      line-height: 1.8;
      font-size: 1rem;
    }

    /* 전체화면 읽기 모드일 때 가운데 정렬 및 편안한 최대 폭 유지 */
    .dashboard-body.fullscreen-mode .report-card {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .dashboard-body.fullscreen-mode .chat-section {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    .chat-section {
      display: flex;
      gap: 8px;
      background: var(--bg-card);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .chat-section input {
      flex: 1;
    }

    /* 마크다운 스타일 */
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: var(--accent);
      margin-top: 22px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 0.95rem;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }
    .markdown-body th {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
    }
    .markdown-body strong {
      color: #7dd3fc;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-content {
      background: var(--bg-card);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      border: 1px solid var(--border);
    }

    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
        overflow: visible !important;
        height: auto !important;
      }
      header, .panel-input, .chat-section, .header-actions, .report-top-bar {
        display: none !important;
      }
      .dashboard-body, .panel-output, .report-card {
        display: block !important;
        height: auto !important;
        padding: 0 !important;
        border: none !important;
        background: #fff !important;
        color: #000 !important;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body strong {
        color: #000 !important;
      }
      .markdown-body th {
        background: #f0f0f0 !important;
        color: #000 !important;
      }
      .markdown-body th, .markdown-body td {
        border-color: #999 !important;
      }
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="brand">
      <span>🛡️ AI 방재·안전 종합센터</span>
    </div>

    <!-- 모드 선택 -->
    <div class="mode-tabs">
      <button class="tab-btn active" onclick="switchMode('accident')">🚨 사고 분석</button>
      <button class="tab-btn" onclick="switchMode('hazard')">⚠️ 위험점 발굴</button>
      <button class="tab-btn" onclick="switchMode('inspect')">🔍 정밀 묘사</button>
    </div>

    <div class="header-actions">
      <!-- 패널 접기 / 전체화면 토글 버튼 -->
      <button class="btn-action highlight" id="btnToggleFullscreen" onclick="toggleFullScreenReport()">
        ⛶ 전체화면 읽기
      </button>
      <button class="btn-action" onclick="window.print()">🖨️ PDF/인쇄</button>
      <button class="btn-action" onclick="openSettings()">⚙️ 설정</button>
    </div>
  </header>

  <div class="dashboard-body" id="dashboardBody">
    
    <!-- 좌측 입력 패널 -->
    <div class="panel-input" id="leftPanel">
      <div class="form-group">
        <label>현장 사진 첨부 (촬영 또는 앨범)</label>
        <div class="image-dropzone" onclick="document.getElementById('fileInput').click()">
          <span id="uploadHint" style="font-size: 0.85rem; color: var(--text-muted);">
            📷 탭하여 사진 촬영 또는 앨범 선택
          </span>
          <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImage(this)">
          <div class="preview-box" id="previewContainer">
            <img id="imagePreview" src="">
            <button class="btn-remove-img" type="button" onclick="removeImage(event)">✕</button>
          </div>
        </div>
      </div>

      <div id="dynamicForm"></div>

      <button class="btn-submit" id="btnSubmit" onclick="runAnalysis()">실행 (초고속 Lite 엔진)</button>
    </div>

    <!-- 우측 출력 패널 -->
    <div class="panel-output">
      <div class="report-top-bar">
        <span class="report-title-label" id="reportHeaderLabel">📋 분석 및 진단 보고서</span>
        <div style="display: flex; gap: 6px;">
          <button class="btn-action" onclick="toggleFullScreenReport()" id="subToggleBtn">
            ◀ 입력창 접기
          </button>
        </div>
      </div>

      <div class="report-card" id="reportArea">
        <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted); text-align:center;">
          <div style="font-size:3rem; margin-bottom:12px;">⚡</div>
          <div><strong>초고속 Lite AI 엔진</strong>이 기본 적용되어 있습니다.<br>좌측에 데이터를 입력하고 실행하면 즉시 분석 결과가 생성됩니다.</div>
        </div>
      </div>

      <div class="chat-section">
        <input type="text" id="chatInput" placeholder="보고서에 대해 추가 질의 (예: 방호조치 세부 규정 알려줘)" onkeydown="if(event.key==='Enter') sendFollowUp()">
        <button class="btn-action" style="background:var(--accent); color:#0b0f19; font-weight:bold;" onclick="sendFollowUp()">질문 전송</button>
      </div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <h3 style="margin-bottom:12px;">Google Gemini API 키 등록</h3>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">
        Google AI Studio에서 발급받은 API 키를 입력하세요.
      </p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." style="margin-bottom:16px;">
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn-action" onclick="closeSettings()">닫기</button>
        <button class="btn-action" style="background:var(--accent); color:#0b0f19; font-weight:bold;" onclick="saveSettings()">저장</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'GEMINI_SAFETY_HUB_KEY';
    let currentMode = 'accident';
    let currentImageBase64 = null;
    let currentImageMime = null;
    let conversationHistory = [];
    let isFullScreen = false;

    // 모드별 폼 정의
    const formTemplates = {
      accident: `
        <div class="form-group">
          <label>사고 유형 분류</label>
          <select id="accType">
            <option value="화재 및 폭발">화재 및 폭발</option>
            <option value="유해화학물질 누출/접촉">유해화학물질 누출/접촉</option>
            <option value="감전 및 전기재해">감전 및 전기설비 사고</option>
            <option value="질식 및 유해가스 중독">질식 및 가스 중독</option>
            <option value="기계 끼임 및 협착">기계 끼임 및 협착</option>
            <option value="추락 및 낙하">고소작업 추락 및 낙하</option>
            <option value="기타">기타 안전사고</option>
          </select>
        </div>
        <div class="form-group">
          <label>발생 장소 / 공정 / 설비명</label>
          <input type="text" id="accLocation" placeholder="예: 유기용제 공급 룸 유량계 플랜지">
        </div>
        <div class="form-group">
          <div class="label-row">
            <label>사고 경위 및 발생 상황</label>
            <button class="btn-mic" type="button" onclick="toggleVoice('accSituation', this)">🎤 음성입력</button>
          </div>
          <textarea id="accSituation" placeholder="사고 발생 전후 상황, 작업자 행동, 설비 이상 유무 등"></textarea>
        </div>
        <div class="form-group">
          <label>초기 1차 조치 내역</label>
          <textarea id="accInitialAction" style="min-height:60px;" placeholder="예: 비상 밸브 차단, 환기 가동 등"></textarea>
        </div>
      `,
      hazard: `
        <div class="form-group">
          <label>점검 대상 구역 / 설비</label>
          <input type="text" id="hazLocation" placeholder="예: 옥외 위험물 저장탱크 또는 배전반">
        </div>
        <div class="form-group">
          <label>작업 / 환경 상태</label>
          <input type="text" id="hazWorkType" placeholder="예: 정기 유지보수, 화학물질 이송 작업 등">
        </div>
        <div class="form-group">
          <div class="label-row">
            <label>불안전 상태 / 위험 메모</label>
            <button class="btn-mic" type="button" onclick="toggleVoice('hazNotes', this)">🎤 음성입력</button>
          </div>
          <textarea id="hazNotes" placeholder="현장에서 관찰된 잠재 위험 요소 및 미비 사항"></textarea>
        </div>
      `,
      inspect: `
        <div class="form-group">
          <div class="label-row">
            <label>중점 확인 사항 (선택)</label>
            <button class="btn-mic" type="button" onclick="toggleVoice('inspectNotes', this)">🎤 음성입력</button>
          </div>
          <textarea id="inspectNotes" placeholder="사진 속에서 특히 자세히 확인하고 싶은 부위나 명판 등"></textarea>
        </div>
      `
    };

    window.onload = () => {
      renderForm();
      if (!localStorage.getItem(STORAGE_KEY)) openSettings();
    };

    /* 전체화면 / 좌측 패널 토글 */
    function toggleFullScreenReport() {
      const body = document.getElementById('dashboardBody');
      const mainBtn = document.getElementById('btnToggleFullscreen');
      const subBtn = document.getElementById('subToggleBtn');
      
      isFullScreen = !isFullScreen;
      body.classList.toggle('fullscreen-mode', isFullScreen);

      if (isFullScreen) {
        mainBtn.innerText = '◨ 2단 화면 복귀';
        subBtn.innerText = '▶ 입력창 펼치기';
      } else {
        mainBtn.innerText = '⛶ 전체화면 읽기';
        subBtn.innerText = '◀ 입력창 접기';
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', 
          (mode === 'accident' && idx === 0) || 
          (mode === 'hazard' && idx === 1) || 
          (mode === 'inspect' && idx === 2)
        );
      });
      renderForm();
      const submitBtn = document.getElementById('btnSubmit');
      if (mode === 'accident') submitBtn.innerText = '🚨 사고 분석 실행 (초고속)';
      else if (mode === 'hazard') submitBtn.innerText = '⚠️ 위험점 진단 실행 (초고속)';
      else submitBtn.innerText = '🔍 정밀 묘사 실행 (초고속)';
    }

    function renderForm() {
      document.getElementById('dynamicForm').innerHTML = formTemplates[currentMode];
    }

    function handleImage(input) {
      const file = input.files[0];
      if (!file) return;

      currentImageMime = file.type;
      const reader = new FileReader();
      reader.onload = (e) => {
        const fullBase64 = e.target.result;
        currentImageBase64 = fullBase64.split(',')[1];
        document.getElementById('imagePreview').src = fullBase64;
        document.getElementById('previewContainer').style.display = 'block';
        document.getElementById('uploadHint').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function removeImage(e) {
      e.stopPropagation();
      currentImageBase64 = null;
      currentImageMime = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('previewContainer').style.display = 'none';
      document.getElementById('uploadHint').style.display = 'inline';
    }

    let recognition = null;
    function toggleVoice(targetId, btn) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('음성 인식을 지원하지 않는 브라우저입니다.');
        return;
      }

      if (recognition) {
        recognition.stop();
        recognition = null;
        btn.classList.remove('recording');
        btn.innerText = '🎤 음성입력';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      btn.classList.add('recording');
      btn.innerText = '🔴 듣는 중...';

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const target = document.getElementById(targetId);
        target.value = target.value ? target.value + ' ' + transcript : transcript;
      };

      recognition.onerror = () => {
        btn.classList.remove('recording');
        btn.innerText = '🎤 음성입력';
        recognition = null;
      };

      recognition.onend = () => {
        btn.classList.remove('recording');
        btn.innerText = '🎤 음성입력';
        recognition = null;
      };

      recognition.start();
    }

    /**
     * 초고속 Lite 모델 최우선 호출 (Speed First)
     */
    async function requestGeminiFast(payload, apiKey, onStatusChange) {
      // 속도가 가장 빠른 Lite 모델을 1순위로 배치
      const candidateModels = [
        'gemini-3.5-flash-lite',
        'gemini-3.8-flash',
        'gemini-3.5-flash'
      ];

      let lastError = null;

      for (let i = 0; i < candidateModels.length; i++) {
        const modelName = candidateModels[i];
        try {
          if (i > 0 && onStatusChange) {
            onStatusChange(`대체 엔진(${modelName})으로 연결 중...`);
          }

          const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (data.error) {
            const msg = data.error.message || '';
            if (msg.includes('high demand') || msg.includes('overloaded') || data.error.code === 503 || data.error.code === 404) {
              lastError = new Error(msg);
              continue;
            } else {
              throw new Error(msg);
            }
          }

          const answer = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (answer) return answer;

        } catch (err) {
          lastError = err;
          await new Promise(res => setTimeout(res, 500));
        }
      }

      throw lastError || new Error('일시적인 서버 혼잡입니다. 다시 시도해 주세요.');
    }

    async function runAnalysis() {
      const apiKey = localStorage.getItem(STORAGE_KEY);
      if (!apiKey) {
        alert('API 키를 먼저 등록해주세요.');
        openSettings();
        return;
      }

      let systemPrompt = '';
      let userContext = '';

      if (currentMode === 'accident') {
        const accType = document.getElementById('accType').value;
        const location = document.getElementById('accLocation').value.trim();
        const situation = document.getElementById('accSituation').value.trim();
        const initial = document.getElementById('accInitialAction').value.trim();

        if (!situation && !currentImageBase64) {
          alert('사고 경위를 작성하거나 사진을 첨부해주세요.');
          return;
        }

        systemPrompt = `
당신은 국가 공인 산업안전보건 및 방재 소방 최고 기술사입니다.
제공된 정보와 사진을 바탕으로 핵심만을 명확하고 간결하며 전문적으로 분석한 재발방지대책 보고서를 작성하세요.

[필수 보고서 양식]
### 1. 사고 개요 및 핵심 위험성 요약
### 2. 근본 원인 분석 (4M 기법)
- **인적 (Man)** / **기계·설비 (Machine)** / **환경·물질 (Media)** / **관리적 (Management)**
### 3. 위험성평가 매트릭스 (개선 전/후 비교 표)
| 구분 | 빈도 | 강도 | 위험도 등급 | 판정 |
|---|---|---|---|---|
| 개선 전 | ... | ... | ... | ... |
| 개선 후 | ... | ... | ... | ... |
### 4. 법적·기술 규정 준수 검토 (산업안전기준, 화재안전기술기준 NFTC, KOSHA Guide)
### 5. 3단계 재발방지대책 (공학적 / 관리적 / 보호구 및 비상대응)
`;
        userContext = `[사고 유형] ${accType}\n[장소/설비] ${location || '미기재'}\n[사고 상황] ${situation || '사진 참조'}\n[1차 조치] ${initial || '미기재'}`;

      } else if (currentMode === 'hazard') {
        const location = document.getElementById('hazLocation').value.trim();
        const workType = document.getElementById('hazWorkType').value.trim();
        const notes = document.getElementById('hazNotes').value.trim();

        if (!notes && !currentImageBase64) {
          alert('점검 메모를 입력하거나 사진을 첨부해주세요.');
          return;
        }

        systemPrompt = `
당신은 산업안전 진단 기술사입니다. 현장 사진과 정보를 분석하여 잠재된 위험점을 선제적으로 도출하고 개선안을 제시하세요.
### 1. 안전 점검 총평 및 잠재 위험도
### 2. 불안전한 상태 및 행동 요인
### 3. 예상 사고 시나리오
### 4. 선제적 개선 권고사항 (즉시 조치 / 근본적 개선 / 점검 체크포인트)
`;
        userContext = `[점검 대상] ${location || '현장 사진 기준'}\n[작업/환경] ${workType || '일반'}\n[메모] ${notes || '사진 진단 요청'}`;

      } else if (currentMode === 'inspect') {
        if (!currentImageBase64) {
          alert('현장 정밀 묘사 모드는 사진 첨부가 필수입니다.');
          return;
        }
        const notes = document.getElementById('inspectNotes').value.trim();

        systemPrompt = `
당신은 현장 감식 및 시각 해설 전문가입니다. 시각장애인에게 해설하듯 사진 속 모든 객체와 상태를 명확히 서술하세요.
### 1. 공간 전체 구도 및 분위기
### 2. 주요 설비 및 사물 정밀 식별 (기기명, 모델명, 배관/밸브 위치, 라벨 문구 등)
### 3. 미세 상태 및 결함 (부식, 마모, 누액, 체결 상태 등)
### 4. 작업 환경 및 주변 위험 징후
`;
        userContext = notes ? `[추가 요구] ${notes}` : `사진 속 모든 시각적 정보를 낭독 수준으로 상세히 서술하세요.`;
      }

      const submitBtn = document.getElementById('btnSubmit');
      const reportArea = document.getElementById('reportArea');

      submitBtn.disabled = true;
      submitBtn.innerText = '⚡ 초고속 분석 중...';
      reportArea.innerHTML = '<div id="loadingStatus" style="text-align:center; padding:40px; color:var(--text-muted); font-size:1.05rem;">⚡ 초고속 Lite AI가 보고서를 신속히 작성하고 있습니다...</div>';

      try {
        const parts = [{ text: systemPrompt + "\n\n" + userContext }];

        if (currentImageBase64) {
          parts.unshift({
            inline_data: {
              mime_type: currentImageMime || 'image/jpeg',
              data: currentImageBase64
            }
          });
        }

        const payload = {
          contents: [{ role: 'user', parts: parts }]
        };

        const reply = await requestGeminiFast(payload, apiKey, (statusText) => {
          const statusDiv = document.getElementById('loadingStatus');
          if (statusDiv) statusDiv.innerText = statusText;
        });

        reportArea.innerHTML = `<div class="markdown-body">${marked.parse(reply)}</div>`;
        conversationHistory = [
          { role: 'user', parts: parts },
          { role: 'model', parts: [{ text: reply }] }
        ];

        // 분석 완료 시 가독성을 위해 자동으로 전체화면 모드 전환 (선택적)
        if (!isFullScreen && window.innerWidth < 1200) {
          toggleFullScreenReport();
        }

      } catch (err) {
        alert('분석 오류: ' + err.message);
        reportArea.innerHTML = `<p style="color:var(--danger)">오류 발생: ${err.message}</p>`;
      } finally {
        submitBtn.disabled = false;
        switchMode(currentMode);
      }
    }

    async function sendFollowUp() {
      const apiKey = localStorage.getItem(STORAGE_KEY);
      const input = document.getElementById('chatInput');
      const question = input.value.trim();
      if (!question) return;
      if (!conversationHistory.length) {
        alert('먼저 1차 분석을 실행한 후 추가 질문을 진행해주세요.');
        return;
      }

      input.value = '';
      const reportArea = document.getElementById('reportArea');
      reportArea.innerHTML += `
        <div style="margin-top:20px; padding:12px 16px; background:rgba(56,189,248,0.12); border-left:4px solid var(--accent); border-radius:6px;">
          <strong>질문:</strong> ${question}
        </div>
        <div id="followupLoading" style="color:var(--text-muted); margin-top:8px;">⚡ 답변 작성 중...</div>
      `;
      reportArea.scrollTop = reportArea.scrollHeight;

      conversationHistory.push({
        role: 'user',
        parts: [{ text: question }]
      });

      try {
        const payload = { contents: conversationHistory };
        const reply = await requestGeminiFast(payload, apiKey);
        
        document.getElementById('followupLoading')?.remove();
        reportArea.innerHTML += `<div class="markdown-body" style="margin-top:14px;">${marked.parse(reply)}</div>`;
        conversationHistory.push({
          role: 'model',
          parts: [{ text: reply }]
        });
        reportArea.scrollTop = reportArea.scrollHeight;
      } catch (err) {
        document.getElementById('followupLoading')?.remove();
        alert('후속 질의 오류: ' + err.message);
      }
    }

    function openSettings() {
      document.getElementById('apiKeyInput').value = localStorage.getItem(STORAGE_KEY) || '';
      document.getElementById('settingsModal').style.display = 'flex';
    }
    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }
    function saveSettings() {
      const k = document.getElementById('apiKeyInput').value.trim();
      if (!k) return alert('키를 입력하세요');
      localStorage.setItem(STORAGE_KEY, k);
      closeSettings();
    }
  </script>
